<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Two Sum Solver</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
        h2 { color: #333; margin-top: 0; font-size: 24px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        .alert { padding: 12px; margin-top: 20px; border-radius: 6px; font-size: 15px; }
        .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .info { margin-top: 5px; color: #555; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Two Sum Web Solver</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="nums">Enter Array (separated by spaces or commas):</label>
            <input type="text" id="nums" name="nums" placeholder="e.g., 7, 9, 2, 6" required>
        </div>
        
        <div class="form-group">
            <label for="target">Enter Target Sum:</label>
            <input type="text" id="target" name="target" placeholder="e.g., 11" required>
        </div>
        
        <button type="submit">Find Indices</button>
    </form>

    <!-- Display errors if the backend catches text instead of numbers -->
    {% if error %}
        <div class="alert danger"><strong>Error:</strong> {{ error }}</div>
    {% endif %}

    <!-- Display the successful calculation from our Python logic -->
    {% if result %}
        <div class="alert success">
            <strong>{{ result }}</strong>
            {% if explanation %}
                <div class="info">{{ explanation }}</div>
            {% endif %}
        </div>
    {% endif %}
</div>

</body>
</html>
